name: food11-lab4
services:
  mlflow:
    build: ./mlflow
    image: food11-lab4-mlflow:local
    ports:
      - "127.0.0.1:5500:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  inference:
    build: .
    image: food11-lab4-inference:local
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
  frontend:
    build: ./frontend
    image: food11-lab4-frontend:local
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mlflow-data:
